    <style>
      :root { --bg: #f4ead7; --ink: #3b2f2a; --muted: #6d5d55; --accent: #7a9a3a; --grass: #8fbf4d; --grass-alt: #84b545; --soil: #c9a27a; --soil-alt: #c09872; --size: 32px; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      main { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 12px 16px; }
      h1 { margin: 0; font-size: 22px; }
      button { font: inherit; color: inherit; cursor: pointer; }
      .levels, .modes { display: flex; gap: 6px; }
      .levels button, .modes button, .restart { padding: 6px 14px; border: 2px solid var(--accent); border-radius: 999px; background: #fffaf0; font-weight: 700; }
      .levels button[aria-pressed="true"], .modes button[aria-pressed="true"] { background: var(--accent); color: #fff; }
      .stats { display: flex; align-items: center; gap: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .board { display: grid; grid-template-columns: repeat(var(--w), var(--size)); padding: 6px; border-radius: 10px; background: #6b4a2f; touch-action: manipulation; }
      .c { width: var(--size); height: var(--size); padding: 0; border: 0; border-radius: 0; background: var(--grass); font-size: calc(var(--size) * 0.6); font-weight: 800; line-height: 1; background-position: center; background-repeat: no-repeat; background-size: 80%; }
      .c { -webkit-tap-highlight-color: transparent; outline: none; }
      .c.alt { background-color: var(--grass-alt); }
      .c.hidden:hover { filter: brightness(1.08); }
      .c.open { background-color: var(--soil); cursor: default; }
      .c.open.alt { background-color: var(--soil-alt); }
      .c.flag { background-image: url(/mole-patch/scarecrow.png); }
      .c.mole { background-color: var(--soil); background-image: url(/mole-patch/mole.png); }
      .c.hit { background-color: #e0765a; background-image: url(/mole-patch/mole-eating.png); }
      .c.wrong { background-image: url(/mole-patch/scarecrow.png); opacity: 0.45; }
      .c.sprout::after { content: "🌱"; font-size: calc(var(--size) * 0.55); }
      .n1 { color: #3b7d23; } .n2 { color: #2f6fb3; } .n3 { color: #c0392b; } .n4 { color: #6c3483; }
      .n5 { color: #8e5b2a; } .n6 { color: #16808a; } .n7 { color: #333; } .n8 { color: #777; }
      .msg { min-height: 24px; font-weight: 700; text-align: center; }
      .home { position: fixed; top: 10px; left: 12px; z-index: 1; padding: 8px 14px; border: 2px solid var(--accent); border-radius: 999px; background: #fffaf0; color: var(--ink); font-size: 14px; font-weight: 800; text-decoration: none; box-shadow: 0 2px 8px rgba(59, 47, 42, 0.15); -webkit-tap-highlight-color: transparent; }
      .home:active { transform: scale(0.97); }
      .links { position: fixed; top: 6px; right: 10px; font: 11px/1.4 -apple-system, sans-serif; }
      .links a { color: var(--muted); text-decoration: none; }
    </style>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-51QVNWMBXH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

  <body>
    <main>
      <h1>Mole Patch</h1>
      <div class="levels" id="levels"></div>
      <div class="stats">
        <span id="left" title="남은 두더지"></span>
        <span id="time" title="시간"></span>
        <button class="restart" id="restart">다시 하기</button>
      </div>
      <div class="board" id="board"></div>
      <div class="modes" id="modes">
        <button data-mode="dig" aria-pressed="true">일구기</button>
        <button data-mode="flag" aria-pressed="false">허수아비</button>
      </div>
      <div class="msg" id="msg"></div>
    </main>
    <a class="home" href="/">← 홈으로</a>
    <nav class="links"><a href="/mole-patch/about/">게임 소개</a> · <a href="/privacy/">개인정보처리방침</a></nav>
    <script type="module" src="./main.ts"></script>
  </body>
